cors:
  originPatterns: http://localhost:8080,http://localhost:3000,https://teste.com.br
file:
  upload-dir: /home/lucas/Desktop/Spring-Boot-2025-REST-API-COURSE/UploadDir
spring:
  application:
    name: rest-with-spring-boot-and-java
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/spring_boot_2025_rest?useTimezone=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show-sql: false
        open-in-view: false
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB
logging:
  level:
    root: info
  # br.com.llucascr: INFO

springdoc:
  paths-to-match: /api/v1/**/**
  swagger-ui:
    use-root-path: true